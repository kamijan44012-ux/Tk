name: Deploy to GitHub Pages

# This workflow is OPTIONAL. The simplest way to publish this game is:
#   Settings → Pages → Source: "Deploy from a branch"
#       → Branch: claude/aaa-mobile-fighting-game-nei2o1  /(root) → Save
#
# If instead you set  Settings → Pages → Source: "GitHub Actions",
# then run this workflow (Actions tab → "Deploy to GitHub Pages" → Run workflow)
# to publish automatically.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
